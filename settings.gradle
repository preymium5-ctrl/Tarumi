pluginManagement {
	repositories {
		google {
			content {
				includeGroupByRegex("com\\.android.*")
				includeGroupByRegex("com\\.google.*")
				includeGroupByRegex("androidx.*")
			}
		}
		mavenCentral()
		gradlePluginPortal()
		mavenLocal()
		maven {
			url 'https://jitpack.io'
			content {
				includeGroupByRegex("com\\.github.*")
			}
		}
	}
}
dependencyResolutionManagement {
	repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
	repositories {
		google()
		mavenCentral()
		mavenLocal()
		maven {
			url 'https://jitpack.io'
		}
	}
}

include ':app'
rootProject.name = "Tarumi"

// Use Tarumi's patched source engine when the sibling checkout is available.
// A different checkout can be supplied with -PparsersLocalPath=/path/to/parsers.
def parsersDirectory = file(providers.gradleProperty('parsersLocalPath').getOrElse('../kotatsu-parsers-redo'))
if (parsersDirectory.isDirectory()) {
	includeBuild(parsersDirectory) {
		dependencySubstitution {
			substitute module('com.github.preymium5-ctrl:kotatsu-parsers-redo') using project(':')
		}
	}
}
