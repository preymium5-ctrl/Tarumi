, you’ll live. Instead of me, live happily.”\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nTo save my mother, I went to find the duke who was a supporting character in the original story.\u003Cbr\u003E\r\n\u003Cbr\u003E\r\n“So please propose to my mother, Your Grace.”\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nKnowing the original story, I made a deal with him, and in return, the duke rescued my mother and me from the clutches of my cruel maternal grandfather.\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nAfter successfully completing the contract, I intended to quietly face my death in a place where no one knew me…\u003Cbr\u003E\r\n\u003Cbr\u003E\r\n“Libby, I think I’m feeling a bit unwell. Could you stay by my side?”\u003Cbr\u003E\r\n\u003Cbr\u003E\r\n…Wait, why is this sickly-looking young man holding on to me? But seriously, is he really sick? Something seems off.","followsTotal":1511,"ratedAvg":8.8,"ratedCount":57,"contentRating":"safe","links":{"al":null,"mal":null,"mu":null,"md":null,"mb":null},"url":"/title/l2z0j-looking-for-the-villainesss-contract-husband","uploadUrl":"/user/upload/l2z0j","editUrl":"/user/manga/l2z0j/edit"},{"id":116865,"hid":"zgk6j","title":"Unbeknownst to Me, I am Secretly Dating the Emperor","altTitles":["I\u0027m in a secret love affair with the emperor but I don\u0027t know it","황제와 비밀 연애 중인데 나는 그걸 몰라"],"type":"manhwa","status":"releasing","originalLanguage":"","poster":{"medium":"https://static.comix.to/8ee5/i/4/bc/6a11d53c2a460@280.jpg","large":"https://static.comix.to/8ee5/i/4/bc/6a11d53c2a460.jpg"},"latestChapter":22,"finalChapter":0,"finalVolume":0,"hasChapters":true,"chapterUpdatedAtFormatted":"3d ago","createdAtFormatted":"3w ago","updatedAtFormatted":"4m ago","startDate":"2026","endDate":"?","year":2026,"rank":61,"synopsis":"I was reincarnated in a romance fantasy where the war-crazy tyrant emperor falls in love with the saintly heroine. “The Emperor contracting a romantic relationship with the heroine and then falling in love is something only high societ ncidents began, slowly tightening their grip around her neck. Now, it’s time to face the consequences of her choice.\n\n\u0022We sincerely hope you have a safe and enjoyable year. Let’s have fun together.\u0022","synopsisHtml":"\u0026quot;Welcome to the Rose Mansion. This letter has been written to assist you in leading a safe and peaceful life in the manor for the coming year. Please make an effort to fully acquaint yourself with the following rules at your earliest convenience, and adhere to them as a matter of utmost priority under any circumstances. Bear in mind that you will bear full responsibility for any consequences resulting from the violation of these rules. \u0026quot;\u003Cbr\u003E\n\u003Cbr\u003E\nLife plummeted in an instant after her father’s death. She struggled desperately, even amidst her mother’s extravagance and the mounting debts that they could not overcome.\u003Cbr\u003E\n\u003Cbr\u003E\n“Mother, are you… are you really suggesting I be sold to a man older than you right now?”\u003Cbr\u003E\n\u003Cbr\u003E\nYet, everything collapsed with just one sentence from her mother. Then, an offer to become a tutor came from the wealthiest and most prestigious household of the kingdom, House Otis. She had no choice but to accept.\u003Cbr\u003E\n\u003Cbr\u003E\n“Welcome to the most fragrant tomb in the world, Miss Richelle Howard. Let’s be good, amicable corpses together.”\u003Cbr\u003E\n\u003Cbr\u003E\nA mansion covered in roses. The dazzlingly beautiful Otis family. Within it, strange incidents began, slowly tightening their grip around her neck. Now, it’s time to face the consequences of her choice.\u003Cbr\u003E\n\u003Cbr\u003E\n\u0026quot;We sincerely hope you have a safe and enjoyable year. Let’s have fun together.\u0026quot;","followsTotal":20743,"ratedAvg":8.5,"ratedCount":985,"contentRating":"safe","links":{"al":"https://anilist.co/manga/196510/","mal":"https://myanimelist.net/manga/185900/","mu":"https://www.mangaupdates.com/series/da0cf53/","md in the Count Rohanson’s estate.\r\nA monster wearing the skin of the late Lady Evangelin.\r\n\r\nA heroine who believes the world is a romance fantasy—\r\nand the people around her who end up living through a horror story because of her.","synopsisHtml":"I got reincarnated into a romance fantasy novel.\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nThe problem is, I woke up inside a coffin—on the day of the original body owner’s funeral.\u003Cbr\u003E\r\nAnd since I’ve read way too many novels, I can’t even figure out which story this is. With a cold family and terrified maids, it looks like I’ve possessed the villainess.\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nFine. I’ll use all my romance-fantasy experience to escape this villainess route first!\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nWhile trying to survive, I find a strange symbol.\u003Cbr\u003E\r\n\u003Cbr\u003E\r\n“What is this?”\u003Cbr\u003E\r\n\u003Cbr\u003E\r\n[How to Summon □□]\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nA summoning circle that can call spirits or dragons? Perfect. A villainess needs at least one way to protect herself.\u003Cbr\u003E\r\n\u003Cbr\u003E\r\n“Meow.”\u003Cbr\u003E\r\n\u003Cbr\u003E\r\n…Except, why was I chosen not by a spirit or a dragon, but by a leopard-patterned, cheese-colored kitty with three eyes? Well, whatever—he’s cute, so I don’t mind!\u003Cbr\u003E\r\n\u003Cbr\u003E\r\n---\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nThey say a monster lives in the Count Rohanson’s estate.\u003Cbr\u003E\r\nA monster wearing the skin of the late Lady Evangelin.\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nA heroine who believes the world is a romance fantasy—\u003Cbr\u003E\r\nand the people around her who end up living through a horror story because of her.","followsTotal":42600,"ratedAvg":8.5,"ratedCount":2170,"contentRating":"safe","links":{"al":"https://anilist.co/manga/208654/","mal":null,"mu":"https://www.mangaupdates.com/series/a0ku54k/","md":null,"mb":"https://mangabaka.org/578767/"},"url":"/title/80d0m-my-possession-became-a-ghost-story","uploadUrl":"/user/upload/80d0m","editUrl":"/user/manga/80d0m/edit"},{"id":76757,"hid":"kezre","title":"Sub-Male Lead, You Said It Was A Contract Marriage?","altTitles":["Second Male Lead, You Said It Was A Contract Marriage?","서브 남주님, 계약 결혼이라면서요?","Second Male Lead, It\u0027s a Contract Marriage, You Say?"],"type":"manhwa","status":"releasing","originalLanguage":"ko","poster":{"medium":"https://static.comix.to/8aef/i/6/c7/68dfb7ee02d75@280.jpg","large":"https://static.comix.to/8aef/i/6/c7/68dfb7ee02d75.jpg"},"latestChapter":52,"finalChapter":0,"finalVolume":0,"hasChapters":true,"chapterUpdatedAtFormatted":"2w ago","createdAtFormatted":"8mos ago","updatedAtFormatted":"6m ago","startDate":"2025","endDate":"?","year":2025,"rank":193,"synopsis":"I possessed Villain Supporting Character 1, the one who was executed after saying something foolish to the female lead, who seemed close to the male lead.\n\n‘Well, I’m just a villainous extra anyway. If I don’t play the role, who else will?’\n\nWith that in mind, I decided not to get involved with any of the characters in the original story. Thanks to that, the plot wrapped up safely. But then—the sub-male lead of the original work approached me.\n\n“Would you be interested in a contract marriage?” He waved a contract at me with a gentle smile.\n\nTwo years later, before the short contract period ended, I asked him for a divorce — perhaps a bit earlier than expected.\n\nThat’s when he started acting strange.\n\n“Madam… are you only after my body?”\n\nWhat nonsense is this? You’re the one who suggested a contract marriage. Weren’t we just business partners?\n\n“It was a contract marriage from the start. What are you…?”\n“Then why are you after my purity… my chastity?”\n\nBefore I knew it, his eyes brimmed with tears.\n\n“P-Purity! No, even my Ye-jare* would be fine…!”\n“Did you hate spending the night with me, Julieta? I’ll try harder, so don’t throw me away,” he clung to me desperately.\n\nWhile watching tears stream down his face, I thought: \u0027At this rate, I’ll really end up having to take responsibility for him! No, Sub-Male Lead! You’re the one who said you didn’t have the confidence to love anyone!\u0027","synopsisHtml":"I possessed Villain Supporting Character 1, the one who was executed after saying something foolish to the female lead, who seemed close to the male lead.\u003Cbr\u003E\n\u003Cbr\u003E\n‘Well, I’m just a villainous extra anyway. If I don’t play the role, who else will?’\u003Cbr\u003E\n\u003Cbr\u003E\nWith that in mind, I decided not to get involved with any of the characters in the original story. Thanks to that, the plot wrapped up safely. But then—the sub-male lead of the original work approached me.\u003Cbr\u003E\n\u003Cbr\u003E\n“Would you be interested in a contract marriage?” He waved a contract at me with a gentle smile.\u003Cbr\u003E\n\u003Cbr\u003E\nTwo years later, before the short contract period ended, I asked him for a divorce — perhaps a bit earlier than expected.\u003Cbr\u003E\n\u003Cbr\u003E\nThat’s when he started acting strange.\u003Cbr\u003E\n\u003Cbr\u003E\n“Madam… are you only after my body?”\u003Cbr\u003E\n\u003Cbr\u003E\nWhat nonsense is this? You’re the one who suggested a contract marriage. Weren’t we just business partners?\u003Cbr\u003E\n\u003Cbr\u003E\n“It was a contract marriage from the start. What are you…?”\u003Cbr\u003E\n“Then why are you after my purity… my chastity?”\u003Cbr\u003E\n\u003Cbr\u003E\nBefore I knew it, his eyes brimmed with tears.\u003Cbr\u003E\n\u003Cbr\u003E\n“P-Purity! No, even my Ye-jare* would be fine…!”\u003Cbr\u003E\n“Did you hate spending the night with me, Julieta? I’ll try harder, so don’t throw me away,” he clung to me desperately.\u003Cbr\u003E\n\u003Cbr\u003E\nWhile watching tears stream down his face, I thought: \u0026#039;At this rate, I’ll really end up having to take responsibility for him! No, Sub-Male Lead! You’re the one who said you didn’t have the confidence to love anyone!\u0026# rone. His desire to become emperor was not for personal gain but for the sake of his beloved wife and soon-to-be-born child. However, upon his return, the corpses of his wife and child greeted him, demonstrating the futility of his efforts.\r\n\r\nSeven years later, he couldn’t find joy in anything in the world. So, he didn’t care about the re-opening of the gifted academy’s admissions after seven years. Until he saw a wrinkled application form rolling on the floor. Instead of trying to enroll the child in the gifted academy, he offered various excuses. The document, thrown away like trash without even being considered due to being from a workhouse.\r\n\r\n“I approve this child’s admission.”\r\n\r\nHe wasn’t particularly interested. It was just a warning to those who tried to act arbitrarily. So he couldn’t even remember the name of the child he picked.\r\n\r\n“My name is Ivy Alden.”\r\n\r\nThe child he met in front of his wife’s and daughter’s graves resembled the daughter he had always imagined.","synopsisHtml":"After killing his brother, Clois ascends to the throne. His desire to become emperor was not for personal gain but for the sake of his beloved wife and soon-to-be-born child. However, upon his return, the corpses of his wife and child greeted him, demonstrating the futility of his efforts.\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nSeven years later, he couldn’t find joy in anything in the world. So, he didn’t care about the re-opening of the gifted academy’s admissions after seven years. Until he saw a wrinkled application form rolling on the floor. Instead of trying to enroll the child in the gifted academy, he offered various excuses. The document, thrown away like trash without even being considered due to being from a workhouse.\u003Cbr\u003E\r\n\u003Cbr\u003E\r\n“I approve this child’s admission.”\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nHe wasn’t particularly interested. It was just a warning to those who tried to act arbitrarily. So he couldn’t even remember the name of the child he picked.\u003Cbr\u003E\r\n\u003Cbr\u003E\r\n“My name is Ivy Alden.”\u003Cbr\u003E\r\n\u003Cbr\u003E\r\nThe child he met in front of his wife’s and daughter’s graves resembled the daughter he had always imagined.","followsTotal":19127,"ratedAvg":8.2,"ratedCount":854,"contentRating":"safe","links":{"al":"https://anilist.co/manga/204589/","mal":"https://myanimelist.net/manga/190026/","mu":"https://www.mangaupdates.com/series/vzjrpn1/","md":null,"mb":"https://mangabaka.org/570948/"},"url":"/title/q9wkd-can-i-cry-now","uploadUrl":"/user/upload/q9wkd","editUrl":"/user/manga/q9wkd/edit"},{"id":10646,"hid":"96v5","title":"Devious Son Of Heaven","altTitles":["Master: This Villainous Disciple Is Not The Holy Child","师尊：这个冲师逆徒才不是圣子","Shi Zun: Zhege Chong Shi Nitu Cai Bushi Sheng Zi","Shī Zūn: Zhège Chōng Shī Nìtú Cái Bùshì Shèng Zǐ","Offending My Master","Maestra, este Discípulo Villano no puede ser el Hijo Sagrado","Este Discípulo Tan rebelde No Puede Ser un Discípulo Santo","Sư Tôn: Nghịch Đồ Này Mới Không Phải Là Thánh Tử","Villain Cultivator\u0027s Secret Return"],"type":"manhua","status":"releasing","originalLanguage":"zh","poster":{"medium":"https://static.comix.to/9d19/i/6/88/68de8a65cb908@280.jpg","large":"https://static.comix.to/9d19/i/6/88/68de8a65cb908.jpg"},"latestChapter":186,"finalChapter":0,"finalVolume":0,"hasChapters":true,"chapterUpdatedAtFormatted":"4h ago","createdAtFormatted":"8mos ago","updatedAtFormatted":"1m ago","startDate":"2023","endDate":"?","year":2023,"rank":659,"synopsis":"A hundred years ago, Chu Xiu transmigrated from Earth to Cang Qiong Continent, and received the Destined Villain System. After killing countless holy sons and daughters, he was surrounded by the older generation, and self destructed, possessing Tai Su Sacred Ground Yun Xia Mountain’s senior disciple. This time, he decided to lay low and develop strength. Let’s start small, what about becoming a saint admired by thousands?","synopsisHtml":"A hundred years ag
